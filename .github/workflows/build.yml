name: Cross-Platform Release Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]          # Automatischer Build bei Tags wie v1.0.0
  workflow_dispatch:         # Manueller Start über GitHub-UI

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller

    - name: Build for Windows (.exe)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --noconfirm --onefile --windowed `
          --name PrankJumpAndRun `
          --distpath ./dist `
          --add-data ".;." `
          Spiel.py

    - name: Build for macOS (.app)
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --noconfirm --onefile --windowed \
          --name PrankJumpAndRun \
          --distpath ./dist \
          --add-data ".:." \
          Spiel.py

    - name: Build for Linux (Binary)
      if: matrix.os == 'ubuntu-latest'
      run: |
        pyinstaller --noconfirm --onefile \
          --name PrankJumpAndRun \
          --distpath ./dist \
          --add-data ".:." \
          Spiel.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PrankJumpAndRun-${{ runner.os }}
        path: dist/
